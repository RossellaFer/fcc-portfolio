<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Blog | Rossella Ferrandino</title>
  <link rel="shortcut icon" href="/assets/favicon.ico" type="image/x-icon" />
  <meta name="keyword" content="Rossella Ferrandino, portfolio, javascript, developer" />
  <meta property="og:title" content="Blog | Rossella Ferrandino" />
  <meta property="og:description"
    content="Technical articles, tutorials, and engineering reflections by Rossella Ferrandino." />
  <meta property="og:image" content="https://github.com/RossellaFer/fcc-portfolio/blob/master/preview.png?raw=true" />
  <meta property="og:url" content="https://www.rossellaferrandino.info/blog/" />
  <meta property="og:type" content="website" />
  <link rel="canonical" href="https://www.rossellaferrandino.info/blog/" />
  <meta name="description"
    content="A searchable collection of technical articles, tutorials, and engineering reflections by Rossella Ferrandino." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Blog | Rossella Ferrandino" />
  <meta name="twitter:description"
    content="Technical articles, tutorials, and engineering reflections by Rossella Ferrandino." />
  <meta name="twitter:image" content="https://github.com/RossellaFer/fcc-portfolio/blob/master/preview.png?raw=true" />
  <link rel="stylesheet" type="text/css" href="/portfolio.css?23" />
  <!-- Fonts and Icons -->
  <link defer href="https://fonts.googleapis.com/css?family=Lato" rel="stylesheet" />
  <script defer src="https://kit.fontawesome.com/88f56c2b29.js" crossorigin="anonymous"></script>
</head>

<body>
  {% include "header.njk" %}
  <!-- Main section -->
  <div id="blogs-main">
    <div class="shell wrapper">
      <div class="blog-header">
        <h1>Blog</h1>
        <p>I use the Blog to share technical knowledge through articles, tutorials, and engineering analysis published
          on Medium, Flagship, and elsewhere. Search the archive by topic below.</p>
      </div>
      <div class="blog-search-container">
        <i class="fas fa-search"></i>
        <input type="text" id="blog-search" placeholder="Search by title or tags..." aria-label="Search articles">
      </div>
      <div class="blog-filters">
        <button class="filter-btn active" data-filter="all">#All</button>
        <button class="filter-btn" data-filter="shopify">#Shopify</button>
        <button class="filter-btn" data-filter="devlife">#DevLife</button>
        <button class="filter-btn" data-filter="tutorial">#Tutorial</button>
        <button class="filter-btn" data-filter="react">#React</button>
        <button class="filter-btn" data-filter="sustainable">#Sustainable</button>
        <button class="filter-btn" data-filter="wisejapan">#WiSEJapan</button>
        <button class="filter-btn" data-filter="seo">#SEO</button>
      </div>
      <div id="blog-content-wrapper">
        <!-- Blogs will be injected here by index.js -->
      </div>
      <script src="/blogs-data.js?1"></script>
      <script src="/index.js?3" defer></script>
      <!-- 100% privacy-first analytics -->
      <script async defer src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
      <noscript><img src="https://queue.simpleanalyticscdn.com/noscript.gif" alt=""
          referrerpolicy="no-referrer-when-downgrade" /></noscript>
    </div>
  </div>
  {% include "footer.njk" %}
</body>

</html>
